<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm kiếm công thức nấu ăn</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="hero-section">
        <div class="hero-content">
            <div class="hero-icon">🍳</div>
            <h1>Bếp Ơi - Tìm Kiếm Công Thức Nấu Ăn</h1>
            <p class="subtitle">Khám phá hàng ngàn công thức ngon từ các nguồn uy tín</p>
            
            <form action="/search" method="get" class="search-form-home">
                <div class="search-container">
                    <input 
                        type="text" 
                        name="query" 
                        placeholder="Tìm kiếm công thức: gà kho gừng, bánh mì, mì Ý..." 
                        required
                        class="search-input"
                    >
                    <button type="submit" class="search-button">
                        <span>🔍 Tìm kiếm</span>
                    </button>
                </div>
            </form>

            <div class="suggestions">
                <p class="suggestions-label">Gợi ý: </p>
                <div class="suggestion-tags">
                    <a href="/search?query=gà kho gừng" class="suggestion-tag">Gà kho gừng</a>
                    <a href="/search?query=bánh mì" class="suggestion-tag">Bánh mì</a>
                    <a href="/search?query=phở" class="suggestion-tag">Phở</a>
                    <a href="/search?query=cơm tấm" class="suggestion-tag">Cơm tấm</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
